<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carta Peña Madridista Casasimarro</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        background: #000000;
    }

    body {
        padding: 25px 0;
    }

    .carta {
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
    }

    .pagina {
        width: 100%;
        margin: 0 auto 25px auto;
        background: #ffffff;
        box-shadow: 0 4px 15px rgba(255,255,255,0.12);
    }

    .pagina img {
        display: block;
        width: 100%;
        height: auto;
    }

    .pagina:last-child {
        margin-bottom: 0;
    }

    @media (min-width: 901px) {
        .pagina {
            margin-bottom: 35px;
        }
    }
</style>
</head>

<body>

<div class="carta">

    <div class="pagina">
        <img src="1.png" alt="Carta página 1">
    </div>

    <div class="pagina">
        <img src="2.png" alt="Carta página 2">
    </div>

    <div class="pagina">
        <img src="3.png" alt="Carta página 3">
    </div>

    <div class="pagina">
        <img src="4.png" alt="Carta de vinos">
    </div>

</div>

</body>
</html>
