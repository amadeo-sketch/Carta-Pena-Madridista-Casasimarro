<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carta Peña Madridista Casasimarro</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        background: #eeeeee;
    }

    .carta {
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
    }

    .pagina {
        display: block;
        width: 100%;
        margin-bottom: 12px;
        background: white;
        box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }

    .pagina img {
        display: block;
        width: 100%;
        height: auto;
    }
</style>
</head>

<body>

<div class="carta">

    <div class="pagina">
        <img src="1.png" alt="Carta página 1">
    </div>

    <div class="pagina">
        <img src="2.png" alt="Carta página 2">
    </div>

    <div class="pagina">
        <img src="3.png" alt="Carta página 3">
    </div>

    <div class="pagina">
        <img src="4.png" alt="Carta de vinos">
    </div>

</div>

</body>
</html>
